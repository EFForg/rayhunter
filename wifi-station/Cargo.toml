[package]
name = "wifi-station"
version = "0.10.1"
edition = "2024"
rust-version = "1.88.0"
description = "Async WiFi station (STA) lifecycle manager for embedded Linux"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BeigeBox/wifi-station"
readme = "README.md"
keywords = ["wifi", "embedded", "linux", "wpa-supplicant", "networking"]
categories = ["network-programming"]

[features]
default = []
utoipa = ["dep:utoipa"]
# Use the pure-Rust `shuli` supplicant instead of spawning `wpa_supplicant`.
#
# Off by default on purpose, for two reasons:
#  * `shuli` depends on `aws-lc-rs`, whose C code needs a real cross-compiler.
#    Enabling it unconditionally would break builds that only have the Rust
#    toolchain (notably `cargo build-daemon-firmware-devel`).
#  * `shuli` 0.1.0 requires rustc >= 1.96, well above this crate's declared
#    rust-version of 1.88.0. The package-level MSRV therefore only holds with
#    the feature off; enabling it raises the requirement to 1.96.
rust-supplicant = ["dep:shuli"]

[dependencies]
anyhow = "1.0.98"
chrono = "0.4.31"
futures = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4.20"
netlink-packet-core = "0.8.2"
netlink-packet-route = "0.30"
rtnetlink = { version = "0.21", default-features = false, features = ["tokio_socket"] }
serde = { version = "1.0.193", features = ["derive"] }
shuli = { version = "0.1", optional = true }
tokio = { version = "1.44.2", default-features = false, features = ["fs", "macros", "process", "rt", "time"] }
tokio-util = { version = "0.7.10", features = ["rt"] }
utoipa = { version = "5.4.0", optional = true }
wl-nl80211 = { version = "0.5", default-features = false, features = ["tokio_socket"] }

[dev-dependencies]
tempfile = "3"
